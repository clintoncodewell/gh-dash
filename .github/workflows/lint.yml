name: lint
on:
  pull_request:
    paths-ignore:
      - "docs/**"
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

jobs:
  golangci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
